# 최소 CI (AA Workbench Sprint 11): 오프라인 회귀만 돌린다.
# - 백엔드: DB 테스트는 AA_TEST_* 설정이 없으면 스스로 건너뛴다(test/helpers/aa-env.js). 비밀값을 넣지 않는다.
# - 프론트: 단위 테스트, 타입 검사, 프로덕션 빌드. Supabase 값은 빌드용 자리표시자다(실제 호출 없음).
# DB 포함 테스트와 브라우저·API 인수는 로컬에서 하고 실행계획에 따로 기록한다.
name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (offline)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  frontend:
    name: Frontend tests, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npx next build
